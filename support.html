<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Support — Pig Dice Game</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; background:#f5f7fa; color:#222; }
    h1 { color:#444; margin-bottom: 0.5rem; }
    p { line-height: 1.6; }
    label { display:block; margin-top:1rem; font-weight:600; }
    input, textarea { width:100%; padding:.6rem; font-size:1rem; border:1px solid #ccc; border-radius:8px; }
    button { margin-top:1rem; padding:.7rem 1.25rem; font-size:1rem; background:#007bff; color:#fff; border:none; border-radius:8px; cursor:pointer; }

    .card { background:#fff; padding: 1.25rem 1.5rem; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
    a { color:#0056b3; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>

<body>
  <main class="card">
   <h1>Contact Pig Dice Developer</h1>
<p>If you have questions or feedback about the Pig Dice app, please contact us using the form below. We’ll respond within 24 hours.</p>

<form action="https://formspree.io/f/xovpokap" method="POST">
  <label>
    Your Email:
    <input type="email" name="email" required>
  </label>
  <br><br>
  <label>
    Your Message:
    <textarea name="message" rows="5" required></textarea>
  </label>
  <br><br>
  <button type="submit">Send Message</button>
</form>

<p><em>Thank you for reaching out! Your message will be sent directly to our support team at dicegamepig@gmail.com.</em></p>

  </main>
